<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Datepicker — Time Picker Demo</title>
    <link rel="stylesheet" type="text/css" href="../dist/css/datepicker.css">
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
        max-width: 720px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #333;
      }
      h1 { font-size: 1.5rem; }
      .row { margin-bottom: 1.5rem; }
      label { display: block; font-weight: 600; margin-bottom: 0.25rem; }
      input.dp {
        width: 220px;
        padding: 0.4rem 0.6rem;
        font-size: 0.95rem;
        border: 1px solid #ccc;
        border-radius: 3px;
      }
      .out { font-family: monospace; color: #0a6; font-size: 0.9rem; }
      pre { background: #f5f5f5; padding: 0.75rem; border-radius: 3px; font-size: 0.85rem; overflow-x: auto; }
    </style>
  </head>
  <body>
    <h1>Datepicker — Time Picker Demo</h1>

    <div class="row">
      <label for="dt1">Default (pickTime: false) — date only</label>
      <input id="dt1" class="dp" type="text" placeholder="yyyy-MM-dd">
      <div class="out" id="out1"></div>
    </div>

    <div class="row">
      <label for="dt2">pickTime: true, minuteStep: 1 (per-minute precision)</label>
      <input id="dt2" class="dp" type="text" placeholder="yyyy-MM-dd HH:mm">
      <div class="out" id="out2"></div>
    </div>

    <div class="row">
      <label for="dt3">pickTime: true, minuteStep: 15 (15-minute steps)</label>
      <input id="dt3" class="dp" type="text" placeholder="yyyy-MM-dd HH:mm">
      <div class="out" id="out3"></div>
    </div>

    <div class="row">
      <label>DateRangePicker + pickTime (start — end)</label>
      <div id="rangeWrap" style="display:flex; gap:0.5rem; align-items:center;">
        <input id="rangeStart" class="dp" type="text" placeholder="start">
        <span>~</span>
        <input id="rangeEnd" class="dp" type="text" placeholder="end">
      </div>
      <div class="out" id="outRange"></div>
    </div>

    <h2>Configuration</h2>
    <pre><code>new Datepicker(input, {
  format: 'yyyy-MM-dd HH:mm',
  pickTime: true,
  minuteStep: 15,         // 1, 5, 10, 15, 30, ...
  todayButton: true,
  todayButtonMode: 1,     // 0 = focus only, 1 = select today immediately
  clearButton: true,
});</code></pre>

    <script src="../dist/js/datepicker-full.js"></script>
    <script>
      /* global Datepicker */
      function bind(id, opts, outId) {
        const el = document.getElementById(id);
        const dp = new Datepicker(el, opts);
        const out = document.getElementById(outId);
        const update = () => {
          const d = dp.getDate();
          out.textContent = d ? `getDate() → ${d.toISOString()}` : '';
        };
        el.addEventListener('changeDate', update);
        update();
        return dp;
      }

      const common = {
        todayButton: true,
        todayButtonMode: 1,
        clearButton: true,
      };

      bind('dt1', Object.assign({format: 'yyyy-MM-dd'}, common), 'out1');
      bind('dt2', Object.assign({
        format: 'yyyy-MM-dd HH:mm',
        pickTime: true,
      }, common), 'out2');
      bind('dt3', Object.assign({
        format: 'yyyy-MM-dd HH:mm',
        pickTime: true,
        minuteStep: 15,
      }, common), 'out3');

      const rangeWrap = document.getElementById('rangeWrap');
      const drp = new DateRangePicker(rangeWrap, Object.assign({
        format: 'yyyy-MM-dd HH:mm',
        pickTime: true,
        minuteStep: 5,
        allowOneSidedRange: true
      }, common));
      const outRange = document.getElementById('outRange');
      const updateRange = () => {
        const [s, e] = drp.dates;
        outRange.textContent = (s || e)
          ? `[${s ? new Date(s).toISOString() : '∅'}] ~ [${e ? new Date(e).toISOString() : '∅'}]`
          : '';
      };
      rangeWrap.addEventListener('changeDate', updateRange);
      updateRange();
    </script>
  </body>
</html>
